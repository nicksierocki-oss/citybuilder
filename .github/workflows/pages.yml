name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/practical-dijkstra-7rwj50, claude/friendly-albattani-zo7gee]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: mkdir _site && cp -r index.html css js vendor _site/
      - name: Write version file (open games use it to update themselves)
        run: |
          cd _site
          files=$(find index.html css js -type f | sort | sed 's/.*/"&"/' | paste -sd, -)
          echo "{\"sha\":\"$GITHUB_SHA\",\"files\":[$files]}" > version.json
          cat version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
